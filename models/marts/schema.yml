version: 2

models:
  - name: fct_sales
    description: >
      Order-level fact table combining sales records with product prices.
      Calculates total revenue for each order.
    columns:
      - name: order_id
        description: Unique identifier for each order.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the product sold.
        data_tests:
          - not_null

      - name: total_amount
        description: Total revenue for the order, calculated as quantity multiplied by unit price.
        data_tests:
          - not_null

  - name: dim_customers
    description: >
      Customer-level analytics containing order counts, total revenue,
      and average order value, including customers with no orders.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        data_tests:
          - unique
          - not_null

      - name: total_orders
        description: Number of orders placed by the customer.
        data_tests:
          - not_null

      - name: total_revenue
        description: Total revenue generated by the customer.
        data_tests:
          - not_null

      - name: average_order_value
        description: Average revenue per order for the customer.
        data_tests:
          - not_null